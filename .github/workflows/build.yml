name: Build Plane True All-In-One Pterodactyl Image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - ptero-entrypoint.sh
      - embedded-services.conf
      - service-postgres.sh
      - service-redis.sh
      - service-rabbitmq.sh
      - service-minio.sh
      - .github/workflows/build.yml

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/pterodactyl-plane

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: |
            PLANE_VERSION=v1.4.0
          tags: |
            ${{ env.IMAGE_NAME }}:v1.4.0-ptero4
            ${{ env.IMAGE_NAME }}:latest
