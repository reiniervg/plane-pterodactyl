[program:embedded-postgres]
command=/usr/local/bin/plane-service-postgres
priority=10
autostart=true
autorestart=true
startsecs=2
stopasgroup=true
killasgroup=true
stdout_logfile=/home/container/logs/services/postgres.log
stderr_logfile=/home/container/logs/services/postgres.err.log

[program:embedded-redis]
command=/usr/local/bin/plane-service-redis
priority=20
autostart=true
autorestart=true
startsecs=2
stopasgroup=true
killasgroup=true
stdout_logfile=/home/container/logs/services/redis.log
stderr_logfile=/home/container/logs/services/redis.err.log

[program:embedded-rabbitmq]
command=/usr/local/bin/plane-service-rabbitmq
priority=30
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stdout_logfile=/home/container/logs/services/rabbitmq.log
stderr_logfile=/home/container/logs/services/rabbitmq.err.log

[program:embedded-minio]
command=/usr/local/bin/plane-service-minio
priority=40
autostart=true
autorestart=true
startsecs=2
stopasgroup=true
killasgroup=true
stdout_logfile=/home/container/logs/services/minio.log
stderr_logfile=/home/container/logs/services/minio.err.log
